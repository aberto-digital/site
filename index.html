<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>abertodigital | Presença digital para o seu negócio</title>

<meta property="og:title" content="abertodigital | Sua presença online é o nosso negócio">

<link rel="alternate" hreflang="x-default" href="https://abertodigital.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='24' fill='%231E3050'/%3E%3Cpath d='M24 74V46a24 24 0 0 1 48 0V74Z' fill='%23FFB020'/%3E%3Cpath d='M33 74V46.5a15 15 0 0 1 30 0V74Z' fill='%232F6FED'/%3E%3Cpath d='M33 74V39.5L51 32.5V68.5Z' fill='%231E3050'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101A2C; --navy:#1E3050; --slate:#384358;
    --ambar:#FFB020; --ceu:#2F6FED; --pessego:#FFA586;
    --papel:#F6F7F9; --texto:#101A2C; --secundario:#5B6678;
    --muted:#AEB6C6; --linha-clara:#D5DAE3;
    --display:"Archivo",system-ui,sans-serif;
    --corpo:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--corpo);color:var(--texto);background:var(--papel);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--ambar);outline-offset:3px;border-radius:4px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}

  /* cabeçalho com a logo oficial */
  header{position:sticky;top:0;z-index:40;background:rgba(16,26,44,.92);backdrop-filter:blur(10px);color:var(--papel)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:70px;gap:14px}
  .marca{display:block;flex-shrink:0;line-height:0}
  .logo{height:34px;width:auto;display:block}
  .nav nav{display:flex;gap:24px}
  .nav nav a{font-size:.94rem;color:var(--muted);text-decoration:none}
  .nav nav a:hover{color:var(--papel)}
  .direita{display:flex;align-items:center;gap:10px}
  .idioma{background:transparent;color:var(--papel);border:1px solid var(--slate);border-radius:999px;padding:8px 13px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
  .idioma:hover{background:var(--navy)}
  .botao{display:inline-flex;align-items:center;gap:8px;background:var(--ambar);color:var(--ink);font-weight:700;text-decoration:none;padding:13px 22px;border-radius:999px;transition:background .2s;white-space:nowrap}
  .botao:hover{background:#ffc04d}
  .botao.fantasma{background:transparent;color:var(--papel);box-shadow:inset 0 0 0 1px var(--slate)}
  .botao.fantasma:hover{background:var(--navy)}

  /* abertura: a marca abre e você entra; a frase cresce no arco escuro */
  .abertura{position:relative;z-index:1;height:185vh;background:var(--ink);margin-top:-70px}
  .stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--ink)}
  .arco-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ab-frase{position:absolute;height:0;transform:translateX(-50%);text-align:center;font-family:var(--display);font-stretch:72%;font-weight:850;line-height:1;letter-spacing:-.015em;color:var(--papel);pointer-events:none}
  .ab-frase span{position:absolute;left:0;right:0;top:0;opacity:0;transform:translateY(-50%);will-change:transform,opacity}
  .ab-frase em{font-style:normal;color:var(--ambar)}
  .ab-vao{position:absolute;overflow:hidden;pointer-events:none}
  .frase-wm{display:block;width:100%;height:auto;margin:0 auto}
  .ab-hero{position:relative;z-index:2;margin-top:-100vh;margin-top:-100svh;padding:calc(70px + 9vh) 0 56px;color:var(--papel);opacity:0;pointer-events:none}
  .ab-hero.ativo{pointer-events:auto}
  .ab-hero h1{font-family:var(--display);font-weight:850;font-stretch:70%;font-size:clamp(2.6rem,7vw,6rem);line-height:.94;letter-spacing:-.02em;max-width:900px}
  .ab-hero h1 .linha2{color:var(--ambar)}
  .ab-hero .apoio{color:var(--muted);font-size:1.12rem;max-width:580px;margin-top:24px}
  .wm-inline{display:inline-block;height:1.05em;width:5.74em;vertical-align:-.24em}
  .ab-hero .acoes{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
  .ab-hero .prova{margin-top:36px;display:flex;gap:28px;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
  .ab-hero .prova b{display:block;color:var(--papel);font-weight:700;font-size:1rem}
  .ab-hero .prova div{max-width:300px}

  /* demonstração do WhatsApp */
  .demo{background:var(--ink);color:var(--papel);padding:16px 0 110px;position:relative;z-index:2;overflow:hidden}
  #campo{position:absolute;inset:0;pointer-events:none;z-index:0}
  .demo-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
  .demo h2{color:var(--papel)}
  .demo p{color:var(--muted);max-width:440px;margin-top:20px;font-size:1.05rem}

  .palco{justify-self:center;width:min(340px,100%)}
  .exemplo{display:inline-block;font-size:.74rem;color:var(--muted);margin-bottom:12px;border-bottom:1px dashed var(--slate);padding-bottom:2px}
  .celular{background:var(--ink);border:10px solid var(--navy);border-radius:42px;padding:18px 14px 22px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
  .celular .cab{display:flex;align-items:center;gap:10px;color:var(--papel);font-size:.9rem;font-weight:600;padding:4px 6px 14px;border-bottom:1px solid var(--slate);margin-bottom:14px}
  .celular .av{width:34px;height:34px;border-radius:50%;background:var(--ambar);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.8rem}
  .celular .cab small{display:block;color:var(--muted);font-weight:400;font-size:.76rem}
  .chat{display:flex;flex-direction:column;gap:10px;min-height:340px}
  .bolha{max-width:82%;padding:10px 13px;border-radius:16px;font-size:.92rem;line-height:1.4}
  .bolha.cliente{align-self:flex-start;background:var(--slate);color:var(--papel);border-bottom-left-radius:4px}
  .bolha.bot{align-self:flex-end;background:var(--ceu);color:#fff;border-bottom-right-radius:4px}
  .bolha.dono{align-self:flex-end;background:var(--navy);color:var(--papel);box-shadow:inset 0 0 0 1px var(--ambar);border-bottom-right-radius:4px}
  .bolha .hora{display:block;font-size:.68rem;opacity:.65;margin-top:4px;text-align:right}
  .etiqueta-bot{display:inline-block;font-size:.7rem;font-weight:700;background:var(--ambar);color:var(--ink);padding:2px 8px;border-radius:999px;margin-bottom:6px}
  .chat.anima .bolha{opacity:0;transform:translateY(8px);animation:entra .5s ease forwards}
  .chat.anima .bolha:nth-child(1){animation-delay:.1s}
  .chat.anima .bolha:nth-child(2){animation-delay:.8s}
  .chat.anima .bolha:nth-child(3){animation-delay:1.6s}
  .chat.anima .bolha:nth-child(4){animation-delay:2.4s}
  .chat.anima .bolha:nth-child(5){animation-delay:3.2s}
  .chat.espera .bolha{opacity:0}
  @keyframes entra{to{opacity:1;transform:none}}

  /* seções */
  section{padding:104px 0}
  .faixa{background:var(--navy);color:var(--papel)}
  .cabeca{display:flex;justify-content:space-between;align-items:end;gap:32px;flex-wrap:wrap;margin-bottom:56px}
  h2{font-family:var(--display);font-weight:800;font-stretch:72%;font-size:clamp(2.2rem,5vw,3.9rem);line-height:.98;letter-spacing:-.015em;max-width:720px}
  .cabeca p{color:var(--secundario);max-width:380px}
  .cabeca h2.tempo{max-width:820px}
  .tempo .fixo{display:block}
  .tempo .wm-inline{--wm-aberto:var(--ink);height:.92em;width:5.03em;vertical-align:-.12em;margin-right:.08em}
  .tempo .gira{display:block;color:var(--ceu);min-height:2em}
  .tempo .cursor{display:inline-block;width:.08em;height:.82em;margin-left:.06em;background:var(--ceu);vertical-align:-.04em;animation:pisca 1s steps(1) infinite}
  @keyframes pisca{50%{opacity:0}}
  .so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion: reduce){.tempo .cursor{display:none}}
  .faixa .cabeca p{color:var(--muted)}
  h3{font-family:var(--display);font-weight:700;font-size:1.12rem;letter-spacing:-.01em;margin-bottom:6px}
  p{color:var(--secundario)}
  .faixa p{color:var(--muted)}

  .grupos{display:grid;grid-template-columns:repeat(2,1fr);gap:0 64px}
  .grupo{border-top:2px solid var(--ink);padding:26px 0 40px}
  .grupo h3{font-family:var(--display);font-stretch:76%;font-size:1.9rem;font-weight:800;margin-bottom:20px;color:var(--ink)}
  .grupo:nth-child(2) h3{color:var(--ceu)}
  .grupo ul{list-style:none;display:grid;gap:0}
  .grupo li{padding:16px 0;border-top:1px solid var(--linha-clara)}
  .grupo li:first-child{border-top:0}
  .grupo li strong{display:block;color:var(--texto);font-weight:650;font-size:1rem}
  .grupo li span{color:var(--secundario);font-size:.94rem}
  .base{margin-top:8px;display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--linha-clara);border-radius:14px;overflow:hidden;background:#fff}
  .base div{padding:22px 20px;border-left:1px solid var(--linha-clara)}
  .base div:first-child{border-left:0}
  .base b{display:block;font-family:var(--display);font-weight:750;font-size:1rem;margin-bottom:4px}
  .base span{font-size:.88rem;color:var(--secundario)}

  .escada{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:end}
  .pacote{padding:30px 24px 26px}
  .pacote{background:var(--ink);color:var(--papel);border:1px solid var(--slate);border-radius:6px;padding:34px 30px 30px}
  .pacote.um{min-height:430px}
  .pacote.dois{min-height:490px;background:#24395F;border-color:var(--ceu);box-shadow:8px 8px 0 var(--ambar)}
  .pacote.tres{min-height:540px;background:linear-gradient(165deg,#1E3050 0%,#0C1424 100%);border-color:var(--ceu)}
  .pacote.quatro{min-height:600px;background:linear-gradient(165deg,#24395F 0%,#0C1424 100%);border-color:var(--ambar)}
  .pacote .tag{display:inline-block;margin-top:8px;font-size:.78rem;font-weight:650;color:var(--ambar)}
  .planos{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--slate);border-radius:999px;margin-bottom:10px}
  .planos button{font:inherit;font-size:.92rem;font-weight:600;color:var(--muted);background:none;border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
  .planos button span{color:var(--ambar);font-weight:700}
  .planos button.ativo{background:var(--papel);color:var(--ink)}
  .planos button.ativo span{color:#B56F00}
  .planos button:focus-visible{outline:2px solid var(--ambar);outline-offset:2px}
  .plano-nota{color:var(--muted);font-size:.92rem;margin-bottom:28px;min-height:1.4em}
  .mods{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:0 40px;margin:18px 0 6px}
  .mods li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--slate);color:var(--muted);font-size:.95rem}
  .mods li b{color:var(--papel);font-weight:650}
  .mods li span{white-space:nowrap;color:var(--papel)}
  .pacote p,.pacote li{color:var(--muted)}
  .pacote .nome{font-family:var(--display);font-weight:800;font-stretch:72%;font-size:2rem;letter-spacing:-.01em;color:var(--papel)}
  .pacote .valor{font-family:var(--display);font-weight:800;font-size:2.1rem;letter-spacing:-.03em;margin:16px 0 2px;color:var(--papel)}
  .pacote .valor small{display:block;margin-top:4px;font-size:.98rem;font-weight:500;color:var(--muted)}
  .pacote .setup{font-size:.92rem;margin-bottom:22px}
  .pacote .setup:empty{display:none}
  .pacote .valor{margin-bottom:22px}
  .pacote .valor small.mes{color:var(--papel);font-weight:650;font-size:1.05rem}
  .pacote .valor s{color:var(--muted);font-weight:500;margin-left:4px}
  .pacote ul{list-style:none;display:grid;gap:10px;margin-bottom:30px}
  .pacote li{font-size:.95rem;padding-left:22px;position:relative}
  .pacote li::before{content:"";position:absolute;left:0;top:.6em;width:10px;height:2px;background:var(--ambar)}
  .pacote .botao{width:100%;justify-content:center}
  .pacote .botao.fantasma{color:var(--papel);box-shadow:inset 0 0 0 1px var(--slate)}
  .modulos{margin-top:40px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center;padding:24px 0;border-top:1px solid var(--slate);border-bottom:1px solid var(--slate)}
  .modulos p{max-width:620px}
  .modulos > div{flex:1 1 100%}
  .modulos h3{font-family:var(--display);font-weight:750;font-size:1.25rem;color:var(--papel);margin-bottom:6px}

  .fluxo{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--ink)}
  .fluxo div{padding:30px 30px 0 0}
  .fluxo div+div{padding-left:30px;border-left:1px solid var(--linha-clara)}
  .fluxo .passo{font-family:var(--display);font-weight:800;font-stretch:70%;font-size:5rem;letter-spacing:-.03em;color:var(--ceu);line-height:1}
  .fluxo h3{margin-top:18px}

  .auditoria{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
  .folha{background:var(--papel);color:var(--texto);border-radius:6px;padding:34px;box-shadow:12px 12px 0 var(--ambar);transform:rotate(-1.2deg)}
  .folha h4{font-family:var(--display);font-weight:800;font-stretch:76%;font-size:1.6rem;margin-bottom:14px;color:var(--ink)}
  .folha .linha{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--linha-clara);font-size:.92rem;color:var(--texto)}
  .folha .linha em{font-style:normal;color:#B5452A;font-weight:650}
  .folha .linha em.ok{color:#1F7A4D}

  .cad{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;align-items:start}
  .cad form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cad label{display:grid;gap:6px;font-size:.92rem;font-weight:600;color:var(--texto)}
  .cad .largo{grid-column:1/-1}
  .cad input,.cad select{font:inherit;font-size:1rem;font-weight:400;color:var(--texto);background:#fff;border:1.5px solid #C5CCD8;border-radius:10px;padding:13px 14px;width:100%}
  .cad select{appearance:auto}
  .cad input::placeholder{color:#8A93A3}
  .cad input:hover,.cad select:hover{border-color:#9AA4B5}
  .cad input:focus,.cad select:focus{outline:3px solid var(--ambar);outline-offset:2px;border-color:var(--navy)}
  .cad .check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;font-weight:400;color:var(--secundario)}
  .cad .check input{width:auto;margin-top:3px;accent-color:var(--ambar)}
  .cad button{grid-column:1/-1;padding:16px;font:inherit;font-weight:700;border:0;border-radius:999px;background:var(--ambar);color:var(--ink);cursor:pointer}
  .cad button:hover{background:#ffc04d}
  .cad .nota{grid-column:1/-1;font-size:.85rem;color:var(--secundario)}
  .ok-msg{display:none;grid-column:1/-1;background:var(--ambar);color:var(--ink);padding:14px;border-radius:10px;font-weight:600}
  .ok-msg.mostra{display:block}

  .contato{background:var(--ambar);color:var(--ink)}
  .contato h2{color:var(--ink)}
  .contato p{color:#3A3322}
  .contato .cabeca{margin-bottom:24px}
  .contato .acoes{display:flex;gap:12px;flex-wrap:wrap}
  .contato .botao{background:var(--ink);color:var(--papel)}
  .contato .botao:hover{background:var(--navy)}
  .contato .botao.fantasma{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}

  footer{background:var(--ink);color:var(--muted);padding:30px 0;font-size:.9rem}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
  footer .logo{height:28px}

  @media (max-width:900px){
    .demo-grid,.auditoria,.cad{grid-template-columns:1fr}
    .grupos{grid-template-columns:1fr;gap:0}
    .base{grid-template-columns:1fr 1fr}
    .base div:nth-child(3){border-left:0}
    .base div:nth-child(n+3){border-top:1px solid var(--linha-clara)}
    .escada{grid-template-columns:1fr}
    .pacote.um,.pacote.dois,.pacote.tres,.pacote.quatro{min-height:0}
    .mods{grid-template-columns:1fr}
    .planos button{padding:9px 12px}
    .pacote.dois{box-shadow:none}
    .fluxo{grid-template-columns:1fr}
    .fluxo div+div{padding-left:0;border-left:0;border-top:1px solid var(--linha-clara);margin-top:24px}
    .nav nav{display:none}
    section{padding:72px 0}
    .demo{padding:8px 0 80px}
    #campo{opacity:.22}
  }
  @media (max-width:560px){
    .wrap{padding:0 18px}
    .nav{height:60px;gap:8px}
    .abertura{margin-top:-60px}
    .ab-hero{padding:calc(60px + 7vh) 0 40px}
    .logo{height:27px}
    .direita{gap:6px}
    .direita .botao{padding:9px 13px;font-size:.84rem}
    .idioma{padding:7px 10px;font-size:.78rem}
    .ab-hero h1{font-size:clamp(2.3rem,11vw,3rem)}
    .ab-hero .apoio{font-size:1rem;margin-top:18px}
    .ab-hero .acoes{margin-top:22px}
    .ab-hero .prova{margin-top:24px;gap:18px;font-size:.86rem}
    .folha{padding:24px;box-shadow:8px 8px 0 var(--ambar)}
    .modulos{flex-direction:column;align-items:flex-start}
    .modulos .botao{width:100%;justify-content:center}
  }
  @media (max-height:640px) and (max-width:560px){ .ab-hero .prova{display:none} }

  /* sem animação: mostra a hero direto */
  .abertura.estatica{display:none}
  .abertura.estatica + .ab-hero{margin-top:0;opacity:1;pointer-events:auto}
</style>
</head>
<body>

<!-- logo oficial, em grupos reutilizáveis sem distorção -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="g-icone" transform="scale(0.5833333333333334)">
      <rect width="96" height="96" rx="24" fill="#1E3050"/>
      <path d="M24 74V46a24 24 0 0 1 48 0V74Z" fill="#FFB020"/>
      <path d="M33 74V46.5a15 15 0 0 1 30 0V74Z" fill="#2F6FED"/>
      <path d="M33 74V39.5L51 32.5V68.5Z" fill="#1E3050"/>

  function clamp(v){ return Math.max(0, Math.min(1, v)); }
  function suave(t){ return t * t * (3 - 2 * t); }
  function impacto(t){ var c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
  var vao = document.getElementById('abVao');
  var trechos = frase.querySelectorAll('span');
  var janelas = [[0.2, 0.42], [0.42, 0.62], [0.62, 0.82]];
  var mult = [1.6, 1.12, 1.18];

  if (reduz) abertura.classList.add('estatica');

  function atualiza() {
    if (reduz) return;
    var W = stage.clientWidth, H = stage.clientHeight;
    var total = abertura.offsetHeight - H;
    var p = total > 0 ? clamp(-abertura.getBoundingClientRect().top / total) : 1;

    var s0 = Math.min(0.74 * W / 48, 0.6 * H / 52);
    var s1 = Math.max(1.3 * W / 17.2, 1.35 * H / 24.4);
    var q = suave(clamp((p - 0.04) / 0.8));
    var sc = s0 * Math.pow(s1 / s0, q);
    var cx = 48, cy = 50 + (62 - 50) * q;
    var vw = W / sc, vh = H / sc, vx = cx - vw / 2, vy = cy - vh / 2;
    svg.setAttribute('viewBox', vx.toFixed(4) + ' ' + vy.toFixed(4) + ' ' + vw.toFixed(4) + ' ' + vh.toFixed(4));

    var a = suave(clamp((p - 0.01) / 0.18));
    porta.setAttribute('transform', 'translate(33 0) scale(' + (1 - 0.97 * a).toFixed(4) + ' 1) translate(-33 0)');
    escuro.setAttribute('opacity', suave(clamp((p - 0.04) / 0.14)).toFixed(3));

    var largura = Math.min(17.2 * sc * 0.84, W * 0.88, 980);
    var fonte = largura / 11;
    frase.style.width = largura + 'px';
    var vL = (39.4 - vx) * sc, vT = (41 - vy) * sc, vW = 17.2 * sc, vH = 33 * sc;
    vao.style.left = vL + 'px'; vao.style.top = vT + 'px';
    vao.style.width = vW + 'px'; vao.style.height = vH + 'px';
    vao.style.borderRadius = (8.6 * sc) + 'px ' + (8.6 * sc) + 'px 0 0';
    frase.style.left = (vW / 2) + 'px';
    frase.style.top = (Math.min((59 - vy) * sc, H * 0.52) - vT) + 'px';
    for (var k = 0; k < trechos.length; k++) {
      var j = janelas[k], t = (p - j[0]) / (j[1] - j[0]);
      var tin = clamp(t / 0.3);
      var tout = k === trechos.length - 1 ? clamp((p - 0.8) / 0.05) : clamp((t - 0.8) / 0.2);
      var op = clamp(tin * 2.5) * (1 - tout);
      var esc = (1 + 0.75 * (1 - impacto(tin))) * (1 - 0.15 * tout);
      var el = trechos[k];
      el.style.fontSize = Math.min(fonte * mult[k], 128) + 'px';
      el.style.opacity = op.toFixed(3);
      el.style.transform = 'translateY(-50%) scale(' + esc.toFixed(4) + ')';
    }

    var h = clamp((p - 0.8) / 0.13);
    heroTxt.style.opacity = h.toFixed(3);
    heroTxt.classList.toggle('ativo', h > 0.6);
  }
  var pendente = false;
  window.addEventListener('scroll', function(){
    if (!pendente) { pendente = true; requestAnimationFrame(function(){ pendente = false; atualiza(); }); }
  }, {passive: true});
  window.addEventListener('resize', atualiza);
  atualiza();

  var chat = document.getElementById('chat');
  if (reduz || !('IntersectionObserver' in window)) { chat.classList.remove('espera'); }
  else {
    new IntersectionObserver(function(es, ob){
      es.forEach(function(e){ if (e.isIntersecting) { chat.classList.remove('espera'); chat.classList.add('anima'); ob.disconnect(); } });
    }, {threshold: 0.35}).observe(chat);
  }

  document.getElementById('cadForm').addEventListener('submit', function(e){
    e.preventDefault();
    var f = e.target, t = T[L];
    var msg = t.mIntro + '\n' +
      t.mNome + ': ' + f.elements.nome.value + '\n' +
      t.mNeg + ': ' + f.elements.negocio.value + '\n' +
      t.mRamo + ': ' + f.elements.ramo.selectedOptions[0].textContent + '\n' +
      t.mCid + ': ' + f.elements.cidade.value + '\n' +
      t.mZap + ': ' + f.elements.zap.value + '\n' +
      t.mNeed + ': ' + f.elements.need.selectedOptions[0].textContent;
    window.open(WA + encodeURIComponent(msg), '_blank', 'noopener');
    document.getElementById('okMsg').classList.add('mostra');
  });

  var demo = document.querySelector('.demo');
  var c = document.getElementById('campo');
  var ctx = c.getContext('2d');
  var cores = ['#FFB020','#2F6FED','#FFA586','#AEB6C6','#F6F7F9'];
  var N = 280, pts = [];
  for (var i = 0; i < N; i++) {
    var y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), t2 = i * 2.399963;
    pts.push({x: Math.cos(t2) * r, y: y, z: Math.sin(t2) * r, c: cores[i % cores.length]});
  }
  var w, hh, dpr, gx, gy, R, ang = 0;
  function ajusta() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = demo.clientWidth; hh = demo.clientHeight;
    c.width = w * dpr; c.height = hh * dpr;
    c.style.width = w + 'px'; c.style.height = hh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (w < 900) { gx = w * 0.82; gy = hh * 0.12; R = Math.min(w, hh) * 0.24; }
    else { gx = w * 0.72; gy = hh * 0.5; R = Math.min(w, hh) * 0.34; }
  }
  function desenha() {
    ctx.clearRect(0, 0, w, hh);
    var ca = Math.cos(ang), sa = Math.sin(ang), tilt = 0.35, ct = Math.cos(tilt), st = Math.sin(tilt);
    var arr = pts.map(function(p) {
      var x = p.x * ca + p.z * sa, z = -p.x * sa + p.z * ca;
      var yy = p.y * ct - z * st; z = p.y * st + z * ct;
      return {x: x, y: yy, z: z, c: p.c};
    }).sort(function(a, b){ return a.z - b.z; });
    for (var k = 0; k < arr.length; k++) {
      var p = arr[k], f = (p.z + 1) / 2;
      ctx.globalAlpha = 0.15 + f * 0.85;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(gx + p.x * R, gy + p.y * R, 0.8 + f * 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function loop() { ang += 0.0035; desenha(); requestAnimationFrame(loop); }
  ajusta();
  window.addEventListener('resize', function(){ ajusta(); desenha(); });
  if (reduz) desenha(); else loop();
})();
</script>
